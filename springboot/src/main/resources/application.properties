# ---------- HikariCP 连接池存活检测（解决云数据库 30min 空闲后 recv failed 断连问题）----------
# 腾讯云 CynosDB/阿里云 RDS 空闲超时通常只有 30min，比本地 MySQL 默认 8h 短得多
# 每次从池中拿连接时先执行 SELECT 1 测试，死连接会被自动丢弃换新建连接
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
# 单个连接获取超时（等待池中空闲连接或新建连接的最大时间）
spring.datasource.hikari.connection-timeout=30000
# 连接的最大生存时间（无论是否空闲都销毁重建），必须比 MySQL wait_timeout 小至少 30s，这里 29 分钟
spring.datasource.hikari.max-lifetime=1740000
# 空闲连接在池中最多保留 10 分钟后销毁，避免积累 stale 死连接
spring.datasource.hikari.idle-timeout=600000
# 空闲 5 分钟后发送 TCP keepalive 探测，防止中间防火墙/云数据库网关掐断
spring.datasource.hikari.keepalive-time=300000
# 池大小配置（演示环境够用，压测时根据实际并发调大）
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# 连接占用超过 20s 打 WARN 日志，辅助排查连接泄漏（事务/查询卡住没 close）
spring.datasource.hikari.leak-detection-threshold=20000

spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false

# 表名 user 在 MySQL 中为敏感/保留相关名，统一加反引号生成 `user`，避免登录查询 SQL 解析失败
mybatis-plus.global-config.db-config.table-format=`%s`

